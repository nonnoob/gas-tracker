<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gas Tracker</title>
<meta name="description" content="Costco 油价：实时查询与历史走势">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⛽</text></svg>">
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --border: #e3e6ea;
    --text: #15181d; --muted: #6b7280; --accent: #0b6bcb;
    --down: #12805c; --up: #c0392b;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --radius: 12px;
    --s1:#0b6bcb; --s2:#c0392b; --s3:#12805c; --s4:#8a5cf6; --s5:#d97706; --s6:#0e7490;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e1116; --surface:#161b22; --border:#2a313a;
      --text:#e6e9ee; --muted:#9aa4b2; --accent:#58a6ff;
      --down:#3fb950; --up:#f85149; --shadow:none;
      --s1:#58a6ff; --s2:#f85149; --s3:#3fb950; --s4:#bc8cff; --s5:#e3b341; --s6:#39c5cf;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", Roboto, sans-serif; }
  .wrap { max-width:1060px; margin:0 auto; padding:24px 16px 64px; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:baseline; margin-bottom:6px; }
  h1 { font-size:20px; margin:0; letter-spacing:-.01em; }
  .tagline { color:var(--muted); font-size:13px; }
  .spacer { flex:1; }
  h2 { font-size:13px; letter-spacing:.06em; color:var(--muted);
       margin:30px 0 4px; font-weight:600; text-transform:uppercase; }
  .sectionnote { color:var(--muted); font-size:12px; margin:0 0 12px; }
  button, input, select {
    font:inherit; font-size:14px; padding:7px 12px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  button { cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover:not(:disabled) { filter:brightness(1.08); color:#fff; }
  button:disabled { opacity:.55; cursor:default; }
  .cards { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
          padding:14px; box-shadow:var(--shadow); position:relative; }
  .card .swatch { position:absolute; inset:0 auto 0 0; width:3px;
                  border-radius:var(--radius) 0 0 var(--radius); }
  .card h3 { margin:0 0 2px; font-size:15px; }
  .card h3 { padding-right:24px; }
  .card .unfollow { position:absolute; top:8px; right:8px; width:24px; height:24px; padding:0;
                    line-height:22px; font-size:15px; border-color:transparent; background:transparent;
                    color:var(--muted); }
  .card .sub { color:var(--muted); font-size:12px; margin-bottom:10px; }
  .price-row { display:flex; align-items:baseline; gap:8px; margin-bottom:4px;
               flex-wrap:nowrap; white-space:nowrap; }
  .fuel { width:56px; flex:none; color:var(--muted); font-size:12px; text-transform:capitalize; }
  .price { font-size:19px; font-weight:620; font-variant-numeric:tabular-nums; }
  .cheapest { font-size:11px; color:var(--down); font-weight:600; margin-left:auto; }
  .err { color:var(--up); font-size:12px; }
  .panel { background:var(--surface); border:1px solid var(--border);
           border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px;
          border-radius:999px; border:1px solid var(--border); background:transparent;
          color:var(--muted); cursor:pointer; }
  .chip .dot { width:8px; height:8px; border-radius:50%; background:currentColor; }
  .chip.on { color:var(--text); border-color:currentColor; }
  svg { width:100%; height:auto; display:block; }
  .grid-line { stroke:var(--border); stroke-width:1; }
  .axis-text { fill:var(--muted); font-size:11px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .empty { color:var(--muted); padding:22px 4px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:var(--text); color:var(--bg); padding:9px 16px; border-radius:8px;
           font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:10; }
  .toast.show { opacity:1; }
  @media (max-width:560px) { .wrap { padding:16px 16px 48px; } h1 { font-size:18px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⛽ Gas Tracker</h1>
    <span class="tagline">Costco 油价</span>
    <span class="spacer"></span>
    <button class="primary" id="refresh">刷新实时价</button>
  </header>

  <h2>实时价格</h2>
  <p class="sectionnote" id="live-note">每次查询都直接问 Costco，<strong>不写入数据库</strong>，不影响下面的历史曲线。</p>
  <div class="cards" id="live-cards"></div>

  <div class="panel" style="margin-top:14px">
    <div class="controls" style="margin-bottom:0">
      <input id="zip" placeholder="邮编，如 92618" value="92618" size="14" inputmode="numeric">
      <button id="search">查附近任意 Costco</button>
      <span id="search-status" style="color:var(--muted);font-size:12px"></span>
    </div>
    <div id="results"></div>
  </div>

  <h2>历史走势</h2>
  <p class="sectionnote" id="history-note"></p>
  <div class="panel">
    <div class="controls">
      <select id="fuel"></select>
      <select id="days">
        <option value="7">近 7 天</option>
        <option value="30" selected>近 30 天</option>
        <option value="90">近 90 天</option>
        <option value="365">近一年</option>
      </select>
      <span class="spacer"></span>
      <span id="chart-hint" style="color:var(--muted);font-size:12px"></span>
    </div>
    <div id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
